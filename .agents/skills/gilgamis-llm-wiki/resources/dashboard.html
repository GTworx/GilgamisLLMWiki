  "themes": {
    "cooperation-and-reciprocity": {
      "slug": "cooperation-and-reciprocity",
      "name": "Cooperation and Reciprocity",
      "summary": "The theoretical and empirical principles governing how conditional cooperation, mutual restraint, and reciprocal punishment emerge and persist among self-interested actors without centralized enforcement.",
      "synthesis": "Cooperation and reciprocity form the bedrock of social order, international security regimes, and evolutionary biology. In the classic Prisoner's Dilemma, immediate self-interest dictates defection (cheating), leading to suboptimal outcomes for all participants. However, when interactions are repeated and the future matters, reciprocity transforms the strategic landscape.\n\nIn *The Evolution of Cooperation*, Robert Axelrod provides mathematical and empirical proof that the principle of reciprocity—exemplified by Anatol Rapoport's **TIT FOR TAT** strategy—solves the problem of cooperation (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 2, pp. 27–54). Reciprocity succeeds because it combines four essential strategic virtues:\n1. **Niceness**: Never being the first to defect prevents unnecessary conflict.\n2. **Retaliation / Provocability**: Immediate punishment of defection protects the actor from exploitation.\n3. **Forgiveness**: Restoring cooperation immediately after the adversary relents stops destructive recrimination cascades.\n4. **Clarity**: Predictability and transparent rules allow counterparts to recognize and adapt to the reciprocal pattern (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 2, p. 54; ch. 6, pp. 110–123).\n\nThis mechanism explains real-world phenomena ranging from biological mutualism (Axelrod & Hamilton, ch. 5, pp. 88–108) to the tacit \"live-and-let-live\" non-aggression pacts between opposing infantrymen in the trenches of World War I (Axelrod, ch. 4, pp. 73–87). \n\nIn modern strategic thought, reciprocity is the positive counterpart to military deterrence. As Osinga and Sweijs demonstrate in *Deterrence in the 21st Century*, deterrence by punishment relies on the threat of reciprocal cost-imposition, but deterrence stability inevitably collapses if it is not paired with credible assurances—the promise that compliance will be met with reciprocal restraint (source: raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 2, pp. 14–18; ch. 26, pp. 503–534). Without reciprocity and forgiveness, coercive signaling degenerates into runaway escalation spirals.\n\n---"
    },
    "cross-domain-conflict": {
      "slug": "cross-domain-conflict",
      "name": "Cross-Domain Conflict",
      "summary": "Strategic interaction and coercive bargaining where threats, denial, or punishment in one domain (e.g., cyber, space, economic, information, nuclear) are used to deter or respond to actions in another.",
      "synthesis": "Cross-Domain Deterrence (CDD) emerged as a central paradigm in 21st-century strategic thought to address the complex reality of contemporary warfare, where states seamlessly integrate kinetic and non-kinetic instruments across land, sea, air, space, cyberspace, electromagnetic spectrum, and the global financial system (source: raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 8, pp. 129–159; ch. 26, pp. 503–536)."
    },
    "deterrence-and-coercion": {
      "slug": "deterrence-and-coercion",
      "name": "Deterrence and Coercion",
      "summary": "The strategy and psychology of preventing unwanted adversary actions through the credible threat of unacceptable costs (punishment) or rendering the objective unattainable (denial).",
      "synthesis": "Deterrence is a coercive strategy designed to prevent an adversary from initiating an undesirable action. Unlike defense (which aims to defeat an attack once launched) or compellence (which seeks to force an adversary to change an existing behavior or cease an ongoing action), deterrence aims to preserve the status quo by manipulating the adversary's cost-benefit calculus (source: raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 1, pp. 1–6; ch. 2, pp. 13–27)."
    },
    "evolution-of-strategies": {
      "slug": "evolution-of-strategies",
      "name": "Evolution of Strategies",
      "summary": "The dynamic processes by which strategic heuristics, operational doctrines, and behavioral phenotypes emerge, invade, compete, and stabilize within biological and social populations over time.",
      "synthesis": "Strategic paradigms are not static; they co-evolve in response to changing environmental conditions, technological innovations, and the behavioral adaptations of adversaries. The evolution of strategies can be analyzed both through formal computational/biological population models and through the historical evolution of military doctrines (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 3, pp. 55–72; raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 1, pp. 1–11; ch. 26, pp. 503–536)."
    },
    "hybrid-threats-and-cyber-warfare": {
      "slug": "hybrid-threats-and-cyber-warfare",
      "name": "Hybrid Threats and Cyber Warfare",
      "summary": "The integration of unconventional, covert, cyber, electronic, economic, and informational instruments designed to achieve strategic goals below the threshold of open armed conflict.",
      "synthesis": "Contemporary security is characterized by the widespread exploitation of the \"grey zone\"—the competitive space between normal peace and major interstate war. In this space, adversaries deploy hybrid threats that deliberately remain beneath the legal and operational thresholds that would trigger collective defense (such as NATO Article 5) (source: raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 19–21, pp. 365–419; ch. 26, pp. 524–528)."
    },
    "non-western-strategic-thought": {
      "slug": "non-western-strategic-thought",
      "name": "Non-Western Strategic Thought",
      "summary": "The doctrines, cultural concepts, and operational paradigms of deterrence, coercion, and strategy developed in non-Western strategic cultures, specifically Russia, China, Iran, and South Asia.",
      "synthesis": "Western deterrence theory has historically been grounded in Anglo-American rational choice models, viewing deterrence as a binary, peacetime state designed to preserve the status quo. However, as demonstrated across Part II of *Deterrence in the 21st Century*, non-Western strategic cultures operate with radically different conceptual frameworks, vocabulary, and operational assumptions (source: raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 9–13, pp. 161–261; ch. 26, pp. 517–520)."
    },
    "nuclear-strategy-and-strategic-stability": {
      "slug": "nuclear-strategy-and-strategic-stability",
      "name": "Nuclear Strategy and Strategic Stability",
      "summary": "The doctrines, operational postures, arms control frameworks, and technological dynamics governing the role of nuclear weapons in preventing major power war while avoiding catastrophic escalation.",
      "synthesis": "Nuclear deterrence represents the most consequential application of strategic theory in human history. Defined by the existential condition of Mutual Assured Destruction (MAD), nuclear deterrence posits that no rational actor will initiate a major war against a nuclear-armed opponent possessing an invulnerable second-strike capability, as the retaliatory punishment would guarantee unacceptable societal destruction (source: raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 1, pp. 1–6; ch. 5, pp. 65–86)."
    },
    "rationality-and-decision-making": {
      "slug": "rationality-and-decision-making",
      "name": "Rationality and Decision Making",
      "summary": "The analysis of how human cognition, heuristics, biases, emotions, and computational algorithms shape, distort, or enable strategic decisions in conflict and cooperation.",
      "synthesis": "Traditional models of game theory, economics, and Cold War deterrence were founded on the assumption of the \"rational actor\"—a unitary decision-maker possessing complete information, consistent utility preferences, and flawless probabilistic calculation. However, both behavioral game theory and contemporary empirical research demonstrate that actual human decision-making deviates systematically from pure rationality (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 6, pp. 109–123; raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 22–24, pp. 421–474)."
    },
    "shadow-of-the-future": {
      "slug": "shadow-of-the-future",
      "name": "Shadow of the Future",
      "summary": "The degree to which expected future interactions discount present decisions, shaping whether rational actors choose immediate exploitation or long-term cooperation.",
      "synthesis": "The \"shadow of the future\" refers to the impact of anticipated future interactions on present strategic choices. In formal game theory, this is represented by the discount parameter $w$ ($0 < w < 1$), which incorporates both the time value of payoffs and the probability that the two actors will interact again (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 1, pp. 12–16).\n\nIn single-play or fixed-finite games, backward induction ensures that rational actors defect on the final round, unraveling cooperation all the way back to the initial move. However, when the interaction is repeated with an indefinite or sufficiently large horizon, the shadow of the future alters the strategic payoff matrix: the short-term temptation to defect ($T$) is outweighed by the long-term accumulated loss of future cooperation ($R / (1-w)$) versus future punishment ($P / (1-w)$) (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 1, pp. 14–16; Appendix B, pp. 206–209).\n\nAxelrod demonstrates that mutual cooperation is evolutionarily stable if and only if $w$ meets or exceeds a critical threshold:\n$$w \\ge \\max\\left(\\frac{T-R}{T-P}, \\frac{T-R}{R-S}\\right)$$"
    },
    "tit-for-tat": {
      "slug": "tit-for-tat",
      "name": "Tit for Tat",
      "summary": "The decision rule and strategic heuristic of starting with cooperation and subsequently replicating the opponent's preceding action in every subsequent round.",
      "synthesis": "Submitted by mathematical psychologist Anatol Rapoport to Robert Axelrod's computer tournaments for the iterated Prisoner's Dilemma, **TIT FOR TAT** represents the gold standard of robust strategic decision-making in non-zero-sum environments (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 2, pp. 31–42). \n\nTIT FOR TAT is defined by extreme simplicity:\n1. Move 1: Cooperate ($C$).\n2. Move $t$ ($t > 1$): Play whatever move the opponent played at move $t-1$.\n\nDespite being only four lines of code in FORTRAN and never scoring more points in any single match than its opponent, TIT FOR TAT outperformed all 14 entries in the first tournament and all 62 entries in the second tournament (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 2, pp. 31, 42). Its triumph is explained by the combination of four core qualities:\n- **Niceness**: It never initiates defection, avoiding preemptive conflict cycles.\n- **Retaliation**: It immediately defects following an opponent's defection, preventing exploitation by predatory rules (like TESTER or ALL D).\n- **Forgiveness**: It harbors no long-term memory or grudge; the moment an opponent cooperates, TIT FOR TAT returns to cooperation on the very next move.\n- **Clarity**: Its behavior is easily modeled by the opponent, reducing strategic ambiguity and signaling that mutual cooperation is the only profitable outcome (source: raw/Axelrod_Robert_The_Evolution_of_Cooperation.pdf, ch. 2, pp. 53–54; ch. 6, pp. 110–123).\n\nIn strategic and deterrence literature, TIT FOR TAT provides the mathematical underpinning for **proportional retaliation** and **flexible response**. However, as shown by Roy Lindelauf in *Deterrence in the 21st Century*, in environments with imperfect information, noise, or misperception, pure TIT FOR TAT can become trapped in endless echo-chambers of defection ($C \\to D \\to D \\to D$), necessitating modifications such as \"Generous Tit for Tat\" or \"Contrite Tit for Tat\" (source: raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 22, pp. 423–431; compare with Axelrod, ch. 9, pp. 182–187).\n\n---"
    },
    "violent-non-state-actors": {
      "slug": "violent-non-state-actors",
      "name": "Violent Non-State Actors",
      "summary": "The theoretical concepts, operational methodologies, and challenges of applying deterrence, coercion, and counter-influence against terrorists, insurgent groups, and violent non-state actors (VNSAs).",
      "synthesis": "Following the 9/11 attacks, a widespread consensus emerged among security analysts that violent non-state actors (VNSAs)—such as transnational terrorist groups, insurgent movements, and ideological militias—were \"undeterrable\" because they lacked return addresses, territory to hold hostage, or conventional rational cost calculations. Part III of *Deterrence in the 21st Century* systematically refutes this simplistic view, demonstrating how modern states apply tailored, localized, and cumulative deterrence against non-state adversaries (source: raw/Deterrence in 21st Century Nuclear NetherlandsAnnualReviewO.pdf, ch. 14–17, pp. 263–347; ch. 26, pp. 520–524)."
    }
  }
}
  </script>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let WIKI_DATA = { books: [], authors: {}, genres: {}, themes: {} };

    try {
      const rawJson = document.getElementById('wiki-data-json').textContent;
      WIKI_DATA = JSON.parse(rawJson);
    } catch (e) {
      console.error('Failed to parse embedded wiki data:', e);
    }

    let currentBookSlug = (WIKI_DATA.books && WIKI_DATA.books.length > 0) ? WIKI_DATA.books[0].slug : null;

    function formatWikiLinks(text) {
      if (!text) return '';
      return text.replace(/\[\[([a-zA-Z0-9_-]+)\]\]/g, function(match, slug) {
        let label = slug;
        if (WIKI_DATA.authors[slug]) label = WIKI_DATA.authors[slug].name;
        else if (WIKI_DATA.genres[slug]) label = WIKI_DATA.genres[slug].name;
        else if (WIKI_DATA.themes[slug]) label = WIKI_DATA.themes[slug].name;
        else {
          const b = WIKI_DATA.books.find(x => x.slug === slug);
          if (b) label = b.title;
        }
        return '<span class="clickable-link" data-action="open-entity" data-slug="' + slug + '">' + label + '</span>';
      });
    }

    function formatCitations(text) {
      if (!text) return '';
      return text.replace(/\(source:\s*([^)]+)\)/g, '<span class="quote-citation"><svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> $1</span>');
    }

    function initFilters() {
      const genreSelect = document.getElementById('genreFilter');
      const themeSelect = document.getElementById('themeFilter');

      const genreList = Object.values(WIKI_DATA.genres || {}).sort((a,b) => a.name.localeCompare(b.name));
      genreList.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.slug;
        opt.textContent = g.name;
        genreSelect.appendChild(opt);
      });

      const themeList = Object.values(WIKI_DATA.themes || {}).sort((a,b) => a.name.localeCompare(b.name));
      themeList.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.slug;
        opt.textContent = t.name;
        themeSelect.appendChild(opt);
      });

      genreSelect.addEventListener('change', renderBookList);
      themeSelect.addEventListener('change', renderBookList);
      document.getElementById('searchInput').addEventListener('input', renderBookList);
    }

    function renderBookList() {
      const listEl = document.getElementById('bookList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const genreVal = document.getElementById('genreFilter').value;
      const themeVal = document.getElementById('themeFilter').value;

      listEl.innerHTML = '';

      const books = WIKI_DATA.books || [];
      const filtered = books.filter(book => {
        if (genreVal && !book.genre_slugs.includes(genreVal)) return false;
        if (themeVal && !book.theme_slugs.includes(themeVal)) return false;
        if (searchVal) {
          const searchable = (book.title + ' ' + book.authors_str + ' ' + book.exec_summary + ' ' + book.chapters_raw + ' ' + book.quotes_raw).toLowerCase();
          if (!searchable.includes(searchVal)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<li class="empty-state">No matching books found.</li>';
        return;
      }

      filtered.forEach(book => {
        const li = document.createElement('li');
        li.className = 'book-card ' + (book.slug === currentBookSlug ? 'active' : '');
        li.dataset.action = 'select-book';
        li.dataset.slug = book.slug;

        const genreTags = (book.genre_slugs || []).slice(0, 2).map(g => {
          const name = WIKI_DATA.genres[g] ? WIKI_DATA.genres[g].name : g;
          return '<span class="tag-chip">' + name + '</span>';
        }).join('');

        li.innerHTML = 
          '<div class="book-card-year">' + book.year + '</div>' +
          '<div class="book-card-title">' + book.title + '</div>' +
          '<div class="book-card-authors">' + (book.authors_str || '').replace(/\[\[|\]\]/g, '') + '</div>' +
          '<div class="book-card-tags">' + genreTags + '</div>';
        listEl.appendChild(li);
      });

      if (!filtered.some(b => b.slug === currentBookSlug) && filtered.length > 0) {
        selectBook(filtered[0].slug);
      }
    }

    function selectBook(slug) {
      currentBookSlug = slug;
      renderBookList();
      renderBookDetail();
    }

    function renderBookDetail() {
      const container = document.getElementById('bookDetail');
      const book = (WIKI_DATA.books || []).find(b => b.slug === currentBookSlug);

      if (!book) {
        container.innerHTML = '<div class="empty-state">Please select a book to view details.</div>';
        return;
      }

      const authorLinks = (book.author_slugs || []).map(a => {
        const name = WIKI_DATA.authors[a] ? WIKI_DATA.authors[a].name : a;
        return '<span class="clickable-link" data-action="open-entity" data-slug="' + a + '">' + name + '</span>';
      }).join(', ');

      const genreChips = (book.genre_slugs || []).map(g => {
        const name = WIKI_DATA.genres[g] ? WIKI_DATA.genres[g].name : g;
        return '<span class="tag-chip" data-action="filter-genre" data-slug="' + g + '">' + name + '</span>';
      }).join('');

      const themeChips = (book.theme_slugs || []).map(t => {
        const name = WIKI_DATA.themes[t] ? WIKI_DATA.themes[t].name : t;
        return '<span class="tag-chip" style="background:rgba(192,132,252,0.12); border-color:rgba(192,132,252,0.3); color:#d8b4fe;" data-action="filter-theme" data-slug="' + t + '">' + name + '</span>';
      }).join('');

      let quotesHtml = '';
      const rawQuotes = (book.quotes_raw || '').split(/\n-\s+/).filter(q => q.trim());
      rawQuotes.forEach(q => {
        const cleanQ = q.replace(/^-/, '').trim();
        if (cleanQ) {
          quotesHtml += '<div class="quote-box">' + formatCitations(cleanQ) + '</div>';
        }
      });

      let formattedChapters = (book.chapters_raw || '')
        .replace(/###\s*(.*?)\n/g, '<h3>$1</h3>')
        .replace(/\*\s*\*\*(.*?)\*\*:\s*/g, '<li><strong>$1</strong>: ')
        .replace(/\*\s+/g, '<li>');
      formattedChapters = formatCitations(formatWikiLinks(formattedChapters));

      container.innerHTML = 
        '<div class="book-hero">' +
          '<div class="hero-meta-strip">' +
            '<span class="meta-badge badge-year">Published ' + book.year + '</span>' +
            '<span class="meta-badge badge-source">' + (book.source || '') + '</span>' +
            '<span class="meta-badge badge-source">Updated: ' + (book.last_updated || '') + '</span>' +
          '</div>' +
          '<h1 class="book-hero-title">' + book.title + '</h1>' +
          '<div class="book-hero-authors">By ' + authorLinks + '</div>' +
          '<div class="hero-tags-group">' +
            '<div class="hero-tag-row">' +
              '<span class="hero-tag-label">Genres:</span>' + genreChips +
            '</div>' +
            '<div class="hero-tag-row">' +
              '<span class="hero-tag-label">Themes:</span>' + themeChips +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">' +
              '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Executive Summary' +
            '</div>' +
          '</div>' +
          '<div class="exec-summary-content">' + formatCitations(formatWikiLinks((book.exec_summary || '').replace(/\n\n/g, '</p><p>'))) + '</div>' +
        '</div>' +
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">' +
              '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg> Key Arguments & Chapter Breakdown' +
            '</div>' +
          '</div>' +
          '<div class="chapter-breakdown">' + formattedChapters + '</div>' +
        '</div>' +
        (quotesHtml ? 
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">' +
              '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg> Key Quotes & Citations' +
            '</div>' +
          '</div>' + quotesHtml +
        '</div>' : '') +
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">' +
              '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg> Thematic Connections' +
            '</div>' +
          '</div>' +
          '<div class="thematic-content">' + formatCitations(formatWikiLinks(book.thematic_raw || '')) + '</div>' +
        '</div>';
    }

    function openEntityModal(slug) {
      const overlay = document.getElementById('modalOverlay');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');

      if (WIKI_DATA.authors && WIKI_DATA.authors[slug]) {
        const a = WIKI_DATA.authors[slug];
        titleEl.textContent = 'Author: ' + a.name;
        bodyEl.innerHTML = 
          '<p style="margin-bottom:12px;"><strong>Movements / Eras:</strong> ' + formatWikiLinks(a.eras) + '</p>' +
          '<p style="margin-bottom:16px;"><strong>Primary Genres:</strong> ' + formatWikiLinks(a.genres) + '</p>' +
          '<h4 style="margin-bottom:8px; color:var(--accent-primary);">Biography & Context</h4>' +
          '<p style="margin-bottom:16px;">' + formatWikiLinks(a.bio) + '</p>' +
          '<h4 style="margin-bottom:8px; color:var(--accent-primary);">Recurring Themes</h4>' +
          '<div>' + formatWikiLinks((a.recurring_themes || '').replace(/\n/g, '<br>')) + '</div>';
      } else if (WIKI_DATA.themes && WIKI_DATA.themes[slug]) {
        const t = WIKI_DATA.themes[slug];
        titleEl.textContent = 'Theme: ' + t.name;
        bodyEl.innerHTML = 
          '<p style="margin-bottom:16px;"><strong>Summary:</strong> ' + formatWikiLinks(t.summary) + '</p>' +
          '<h4 style="margin-bottom:8px; color:var(--accent-primary);">Cross-Cutting Synthesis</h4>' +
          '<p>' + formatWikiLinks((t.synthesis || '').replace(/\n\n/g, '</p><p>')) + '</p>';
      } else if (WIKI_DATA.genres && WIKI_DATA.genres[slug]) {
        const g = WIKI_DATA.genres[slug];
        titleEl.textContent = 'Genre: ' + g.name;
        bodyEl.innerHTML = 
          '<p style="margin-bottom:16px;"><strong>Description:</strong> ' + formatWikiLinks(g.description) + '</p>' +
          '<h4 style="margin-bottom:8px; color:var(--accent-primary);">Overview & Scope</h4>' +
          '<p>' + formatWikiLinks((g.overview || '').replace(/\n\n/g, '</p><p>')) + '</p>';
      } else if (WIKI_DATA.books && WIKI_DATA.books.some(b => b.slug === slug)) {
        overlay.classList.remove('active');
        selectBook(slug);
        return;
      } else {
        titleEl.textContent = slug;
        bodyEl.innerHTML = '<p>Entity details not found.</p>';
      }

      overlay.classList.add('active');
    }

    // Event Delegation
    document.addEventListener('click', function(e) {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const slug = target.dataset.slug;

      if (action === 'select-book') {
        selectBook(slug);
      } else if (action === 'open-entity') {
        openEntityModal(slug);
      } else if (action === 'filter-genre') {
        document.getElementById('genreFilter').value = slug;
        renderBookList();
      } else if (action === 'filter-theme') {
        document.getElementById('themeFilter').value = slug;
        renderBookList();
      }
    });

    document.getElementById('modalClose').onclick = () => {
      document.getElementById('modalOverlay').classList.remove('active');
    };

    document.getElementById('modalOverlay').onclick = (e) => {
      if (e.target.id === 'modalOverlay') {
        document.getElementById('modalOverlay').classList.remove('active');
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        document.getElementById('modalOverlay').classList.remove('active');
      }
    });

    document.getElementById('themeToggle').onclick = () => {
      document.body.classList.toggle('light-theme');
    };

    // Initialize UI
    initFilters();
    renderBookList();
    renderBookDetail();
  </script>
</body>
</html>
