<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gilgamis LLM Wiki — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0f141c;
      --bg-surface: #161e2b;
      --bg-surface-elevated: #1e293b;
      --bg-surface-hover: #263348;
      --border-subtle: #2b394e;
      --border-accent: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --accent-primary: #38bdf8;
      --accent-primary-hover: #0ea5e9;
      --accent-gold: #fbbf24;
      --accent-emerald: #34d399;
      --accent-purple: #c084fc;
      --tag-bg: rgba(56, 189, 248, 0.12);
      --tag-border: rgba(56, 189, 248, 0.28);
      --tag-text: #7dd3fc;
      --quote-bg: rgba(30, 41, 59, 0.7);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      --sidebar-width: 350px;
      --header-height: 72px;
    }

    .light-theme {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --bg-surface-hover: #e2e8f0;
      --border-subtle: #cbd5e1;
      --border-accent: #0284c7;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-faint: #94a3b8;
      --accent-primary: #0284c7;
      --accent-primary-hover: #0369a1;
      --accent-gold: #d97706;
      --accent-emerald: #059669;
      --accent-purple: #9333ea;
      --tag-bg: rgba(2, 132, 199, 0.08);
      --tag-border: rgba(2, 132, 199, 0.25);
      --tag-text: #0369a1;
      --quote-bg: #f8fafc;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header {
      height: var(--header-height);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 30;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 260px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-weight: 800;
      font-size: 15px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.5px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span.badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--tag-bg);
      color: var(--accent-primary);
      border: 1px solid var(--tag-border);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* HEADER FILTERS & SEARCH */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      max-width: 920px;
      margin: 0 20px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 12px 9px 36px;
      font-size: 13.5px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      background-color: var(--bg-surface);
    }

    .filter-dropdown {
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      cursor: pointer;
      min-width: 155px;
      transition: border-color 0.2s;
    }

    .filter-dropdown:focus {
      border-color: var(--accent-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border-color: var(--text-faint);
    }

    /* BODY */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* SIDEBAR */
    aside.sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: margin-left 0.28s cubic-bezier(0.4, 0, 0.2, 1), transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.sidebar-collapsed aside.sidebar {
      margin-left: calc(-1 * var(--sidebar-width));
    }

    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 39;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      pointer-events: none;
    }

    body.sidebar-open .sidebar-backdrop {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .sidebar-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .sidebar-toggle-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border-color: var(--accent-primary);
    }

    .sidebar-close-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .sidebar-close-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
      border-color: var(--text-faint);
    }

    .sidebar-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-count-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-primary);
      background: var(--tag-bg);
      padding: 1px 7px;
      border-radius: 10px;
      border: 1px solid var(--tag-border);
      font-family: var(--font-mono);
    }

    .sort-control-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface-elevated);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .sort-pill-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 6px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
      white-space: nowrap;
    }

    .sort-pill-btn:hover {
      color: var(--text-main);
      background: var(--bg-surface-hover);
    }

    .sort-pill-btn.active {
      background: var(--bg-surface);
      color: var(--accent-primary);
      border-color: var(--tag-border);
      box-shadow: var(--shadow-sm);
      font-weight: 700;
    }

    .sort-arrow {
      font-size: 10.5px;
      line-height: 1;
      opacity: 0.85;
      font-family: var(--font-mono);
    }

    .book-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .book-card-added-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--accent-emerald);
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.28);
      padding: 0 5px;
      border-radius: 4px;
    }

    .book-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 12px 10px;
    }

    .book-card {
      padding: 14px 16px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: all 0.18s ease-in-out;
    }

    .book-card:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-subtle);
    }

    .book-card.active {
      background: var(--bg-surface-elevated);
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 1px var(--accent-primary), var(--shadow-sm);
    }

    .book-card-year {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .book-card-title {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .book-card-authors {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .book-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag-chip {
      font-size: 10.5px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--tag-text);
      white-space: nowrap;
      cursor: pointer;
    }

    .tag-chip:hover {
      filter: brightness(1.15);
    }

    /* MAIN PANE */
    main.main-pane {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      background: var(--bg-base);
    }

    .book-detail-container {
      max-width: 980px;
      margin: 0 auto;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HERO METADATA CARD */
    .book-hero {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
    }

    .hero-meta-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .badge-year {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: var(--accent-gold);
      font-family: var(--font-mono);
    }

    .badge-source {
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .book-hero-title {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .book-hero-authors {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .clickable-link {
      color: var(--accent-primary);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }

    .clickable-link:hover {
      text-decoration: underline;
      color: var(--accent-primary-hover);
    }

    .hero-tags-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .hero-tag-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-tag-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-faint);
      min-width: 70px;
    }

    /* SECTION CARD */
    .section-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title svg {
      color: var(--accent-primary);
    }

    /* EXEC SUMMARY */
    .exec-summary-content {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-main);
    }

    .exec-summary-content p {
      margin-bottom: 12px;
    }

    /* CHAPTERS */
    .chapter-breakdown {
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text-main);
    }

    .chapter-breakdown h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-primary);
      margin: 18px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border-subtle);
    }

    .chapter-breakdown ul {
      margin-left: 20px;
      margin-bottom: 14px;
    }

    .chapter-breakdown li {
      margin-bottom: 8px;
    }

    /* QUOTES */
    .quote-box {
      background: var(--quote-bg);
      border-left: 4px solid var(--accent-gold);
      border-radius: 0 8px 8px 0;
      padding: 16px 20px;
      margin-bottom: 14px;
      font-style: italic;
      color: var(--text-main);
      font-family: var(--font-serif);
      font-size: 15.5px;
      line-height: 1.6;
    }

    .quote-citation {
      margin-top: 8px;
      font-size: 12px;
      font-style: normal;
      font-family: var(--font-mono);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* THEMATIC CONNECTIONS */
    .thematic-content {
      font-size: 14.5px;
      line-height: 1.65;
    }

    .thematic-content ul {
      margin-left: 20px;
    }

    .thematic-content li {
      margin-bottom: 10px;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text-main);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-faint);
    }

    /* RESPONSIVE & MOBILE DRAWER */
    @media (max-width: 900px) {
      :root {
        --sidebar-width: 320px;
      }

      aside.sidebar {
        position: fixed;
        top: var(--header-height);
        left: 0;
        bottom: 0;
        width: min(85vw, 340px);
        z-index: 40;
        box-shadow: var(--shadow-lg);
        transform: translateX(-100%);
        margin-left: 0 !important;
      }

      body.sidebar-open aside.sidebar {
        transform: translateX(0);
      }

      .sidebar-close-btn {
        display: inline-flex;
      }

      main.main-pane {
        padding: 24px 18px;
      }

      header {
        padding: 0 16px;
      }

      .brand-section {
        min-width: auto;
        gap: 8px;
      }

      .brand-title span.badge {
        display: none;
      }

      .header-controls {
        margin: 0 10px;
        gap: 8px;
      }

      .filter-dropdown {
        min-width: 110px;
        padding: 8px 10px;
        font-size: 12.5px;
      }
    }

    @media (max-width: 680px) {
      :root {
        --header-height: auto;
      }

      header {
        flex-wrap: wrap;
        height: auto;
        padding: 10px 14px;
        gap: 10px;
      }

      .brand-section {
        min-width: auto;
        flex: 1;
      }

      .brand-title {
        font-size: 16px;
      }

      .header-actions {
        margin-left: auto;
      }

      .header-controls {
        order: 3;
        width: 100%;
        max-width: 100%;
        margin: 0;
        flex-wrap: wrap;
        gap: 8px;
      }

      .search-wrapper {
        width: 100%;
        flex: 1 1 100%;
      }

      .filter-dropdown {
        flex: 1 1 45%;
        min-width: 120px;
      }

      aside.sidebar {
        top: 0;
        height: 100vh;
        width: min(88vw, 320px);
        z-index: 60;
      }

      .sidebar-backdrop {
        z-index: 55;
      }

      .book-hero {
        padding: 20px 16px;
      }

      .book-hero-title {
        font-size: 22px;
      }

      main.main-pane {
        padding: 16px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-section">
      <button id="sidebarToggle" class="sidebar-toggle-btn" title="Toggle Sidebar (Ctrl+B)" aria-label="Toggle Books Sidebar">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <div class="logo-badge">GW</div>
      <div class="brand-title">
        Gilgamis LLM Wiki
        <span class="badge">Dashboard</span>
      </div>
    </div>

    <div class="header-controls">
      <!-- Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search books, authors, concepts, chapters, quotes... (Press '/' to search)">
      </div>

      <!-- Genre Filter -->
      <select id="genreFilter" class="filter-dropdown">
        <option value="">All Genres</option>
      </select>

      <!-- Theme Filter -->
      <select id="themeFilter" class="filter-dropdown">
        <option value="">All Themes</option>
      </select>
    </div>

    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" title="Toggle Dark/Light Mode">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- BODY -->
  <div class="app-body">
    
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- SIDEBAR (SORTABLE: NEWEST FIRST / NEWEST ADDED) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-top">
          <div class="sidebar-title">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
            Ingested Titles
            <span id="sidebarBookCount" class="sidebar-count-badge">0</span>
          </div>
          <button id="sidebarCloseBtn" class="sidebar-close-btn" title="Close Sidebar" aria-label="Close Sidebar">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="sort-control-container" role="tablist" aria-label="Book sorting mode">
          <button id="sortYearBtn" class="sort-pill-btn active" data-sort="year" title="Sort by Publication Year (Click to toggle Ascending/Descending)">
            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span id="sortYearLabel">Newest First</span>
            <span class="sort-arrow" id="yearSortArrow">↓</span>
          </button>
          <button id="sortAddedBtn" class="sort-pill-btn" data-sort="added" title="Sort by Ingestion Date / When Added (Click to toggle Ascending/Descending)">
            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span id="sortAddedLabel">Newest Added</span>
            <span class="sort-arrow" id="addedSortArrow">↓</span>
          </button>
        </div>
      </div>
      <ul id="bookList" class="book-list"></ul>
    </aside>

    <!-- MAIN PANE (SELECTED BOOK DETAIL) -->
    <main class="main-pane" id="mainPane">
      <div class="book-detail-container" id="bookDetail"></div>
    </main>

  </div>

  <!-- ENTITY MODAL (AUTHORS / THEMES / GENRES) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Entity Details</div>
        <button class="icon-btn" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- EMBEDDED DATA -->
  <script id="wiki-data-json" type="application/json">
    /*__WIKI_DATA__*/
  </script>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let WIKI_DATA = { books: [], authors: {}, genres: {}, themes: {} };

    try {
      const rawJson = document.getElementById('wiki-data-json').textContent;
      WIKI_DATA = JSON.parse(rawJson);
    } catch (e) {
      console.error('Failed to parse embedded wiki data:', e);
    }

    let currentBookSlug = (WIKI_DATA.books && WIKI_DATA.books.length > 0) ? WIKI_DATA.books[0].slug : null;

    function formatWikiLinks(text) {
      if (!text) return '';
      return text.replace(/\[\[([a-zA-Z0-9_-]+)\]\]/g, function(match, slug) {
        let label = slug;
        if (WIKI_DATA.authors[slug]) label = WIKI_DATA.authors[slug].name;
        else if (WIKI_DATA.genres[slug]) label = WIKI_DATA.genres[slug].name;
        else if (WIKI_DATA.themes[slug]) label = WIKI_DATA.themes[slug].name;
        else {
          const b = WIKI_DATA.books.find(x => x.slug === slug);
          if (b) label = b.title;
        }
        return '<span class="clickable-link" data-action="open-entity" data-slug="' + slug + '">' + label + '</span>';
      });
    }

    function formatCitations(text) {
      if (!text) return '';
      return text.replace(/\(source:\s*([^)]+)\)/g, '<span class="quote-citation"><svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> $1</span>');
    }

    let currentSortMode = 'year'; // 'year' or 'added'
    let sortDirection = {
      year: 'desc',   // 'desc' = Newest First, 'asc' = Oldest First
      added: 'desc'   // 'desc' = Newest Added, 'asc' = Oldest Added
    };

    try {
      const savedMode = localStorage.getItem('gilgamis_sort_mode');
      if (savedMode === 'year' || savedMode === 'added') currentSortMode = savedMode;
      const savedDirYear = localStorage.getItem('gilgamis_sort_dir_year');
      if (savedDirYear === 'asc' || savedDirYear === 'desc') sortDirection.year = savedDirYear;
      const savedDirAdded = localStorage.getItem('gilgamis_sort_dir_added');
      if (savedDirAdded === 'asc' || savedDirAdded === 'desc') sortDirection.added = savedDirAdded;
    } catch(e) {}

    function updateSortButtonsUI() {
      const yearBtn = document.getElementById('sortYearBtn');
      const addedBtn = document.getElementById('sortAddedBtn');
      const yearLabel = document.getElementById('sortYearLabel');
      const addedLabel = document.getElementById('sortAddedLabel');
      const yearArrow = document.getElementById('yearSortArrow');
      const addedArrow = document.getElementById('addedSortArrow');

      if (yearBtn && addedBtn) {
        yearBtn.classList.toggle('active', currentSortMode === 'year');
        addedBtn.classList.toggle('active', currentSortMode === 'added');

        if (yearLabel) yearLabel.textContent = (sortDirection.year === 'desc') ? 'Newest First' : 'Oldest First';
        if (yearArrow) yearArrow.textContent = (sortDirection.year === 'desc') ? '↓' : '↑';

        if (addedLabel) addedLabel.textContent = (sortDirection.added === 'desc') ? 'Newest Added' : 'Oldest Added';
        if (addedArrow) addedArrow.textContent = (sortDirection.added === 'desc') ? '↓' : '↑';
      }
    }

    function setSortMode(mode) {
      if (currentSortMode === mode) {
        sortDirection[mode] = (sortDirection[mode] === 'desc') ? 'asc' : 'desc';
      } else {
        currentSortMode = mode;
      }
      try {
        localStorage.setItem('gilgamis_sort_mode', currentSortMode);
        localStorage.setItem('gilgamis_sort_dir_year', sortDirection.year);
        localStorage.setItem('gilgamis_sort_dir_added', sortDirection.added);
      } catch(e) {}
      updateSortButtonsUI();
      renderBookList();
    }

    function initFilters() {
      const genreSelect = document.getElementById('genreFilter');
      const themeSelect = document.getElementById('themeFilter');

      const genreList = Object.values(WIKI_DATA.genres || {}).sort((a,b) => a.name.localeCompare(b.name));
      genreList.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.slug;
        opt.textContent = g.name;
        genreSelect.appendChild(opt);
      });

      const themeList = Object.values(WIKI_DATA.themes || {}).sort((a,b) => a.name.localeCompare(b.name));
      themeList.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.slug;
        opt.textContent = t.name;
        themeSelect.appendChild(opt);
      });

      genreSelect.addEventListener('change', renderBookList);
      themeSelect.addEventListener('change', renderBookList);
      document.getElementById('searchInput').addEventListener('input', renderBookList);
    }

    function renderBookList() {
      const listEl = document.getElementById('bookList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const genreVal = document.getElementById('genreFilter').value;
      const themeVal = document.getElementById('themeFilter').value;

      listEl.innerHTML = '';

      const books = WIKI_DATA.books || [];
      const filtered = books.filter(book => {
        if (genreVal && !book.genre_slugs.includes(genreVal)) return false;
        if (themeVal && !book.theme_slugs.includes(themeVal)) return false;
        if (searchVal) {
          const searchable = (book.title + ' ' + book.authors_str + ' ' + book.exec_summary + ' ' + book.chapters_raw + ' ' + book.quotes_raw).toLowerCase();
          if (!searchable.includes(searchVal)) return false;
        }
        return true;
      });

      // Dynamic sorting (Newest First by publication year OR Newest Added by ingestion order)
      filtered.sort((a, b) => {
        if (currentSortMode === 'year') {
          const diff = (sortDirection.year === 'desc') ? (b.year - a.year) : (a.year - b.year);
          if (diff !== 0) return diff;
          return (a.title || '').localeCompare(b.title || '');
        } else {
          const orderA = (a.added_order != null) ? a.added_order : 0;
          const orderB = (b.added_order != null) ? b.added_order : 0;
          const diff = (sortDirection.added === 'desc') ? (orderB - orderA) : (orderA - orderB);
          if (diff !== 0) return diff;
          return (a.title || '').localeCompare(b.title || '');
        }
      });

      // Update sidebar book count badge
      const countBadge = document.getElementById('sidebarBookCount');
      if (countBadge) {
        countBadge.textContent = filtered.length;
      }

      if (filtered.length === 0) {
        listEl.innerHTML = '<li class="empty-state">No matching books found.</li>';
        return;
      }

      filtered.forEach(book => {
        const li = document.createElement('li');
        li.className = 'book-card ' + (book.slug === currentBookSlug ? 'active' : '');
        li.dataset.action = 'select-book';
        li.dataset.slug = book.slug;

        const genreTags = (book.genre_slugs || []).slice(0, 2).map(g => {
          const name = WIKI_DATA.genres[g] ? WIKI_DATA.genres[g].name : g;
          return '<span class="tag-chip">' + name + '</span>';
        }).join('');

        let metaHtml = '<span class="book-card-year">' + book.year + '</span>';
        if (currentSortMode === 'added' && book.added_date) {
          metaHtml += ' <span class="book-card-added-chip">Added ' + book.added_date + '</span>';
        }

        li.innerHTML = 
          '<div class="book-card-meta">' + metaHtml + '</div>' +
          '<div class="book-card-title">' + book.title + '</div>' +
          '<div class="book-card-authors">' + (book.authors_str || '').replace(/\[\[|\]\]/g, '') + '</div>' +
          '<div class="book-card-tags">' + genreTags + '</div>';
        listEl.appendChild(li);
      });

      if (!filtered.some(b => b.slug === currentBookSlug) && filtered.length > 0) {
        selectBook(filtered[0].slug);
      }
    }

    function isMobileView() {
      return window.innerWidth <= 900;
    }

    function toggleSidebar() {
      if (isMobileView()) {
        document.body.classList.toggle('sidebar-open');
      } else {
        document.body.classList.toggle('sidebar-collapsed');
        try {
          localStorage.setItem('gilgamis_sidebar_collapsed', document.body.classList.contains('sidebar-collapsed') ? '1' : '0');
        } catch (e) {}
      }
    }

    function closeSidebar() {
      document.body.classList.remove('sidebar-open');
    }

    function selectBook(slug) {
      currentBookSlug = slug;
      renderBookList();
      renderBookDetail();
      if (isMobileView()) {
        closeSidebar();
      }
    }

    function renderBookDetail() {
      const container = document.getElementById('bookDetail');
      const book = (WIKI_DATA.books || []).find(b => b.slug === currentBookSlug);

      if (!book) {
        container.innerHTML = '<div class="empty-state">Please select a book to view details.</div>';
        return;
      }

      const authorLinks = (book.author_slugs || []).map(a => {
        const name = WIKI_DATA.authors[a] ? WIKI_DATA.authors[a].name : a;
        return '<span class="clickable-link" data-action="open-entity" data-slug="' + a + '">' + name + '</span>';
      }).join(', ');

      const genreChips = (book.genre_slugs || []).map(g => {
        const name = WIKI_DATA.genres[g] ? WIKI_DATA.genres[g].name : g;
        return '<span class="tag-chip" data-action="filter-genre" data-slug="' + g + '">' + name + '</span>';
      }).join('');

      const themeChips = (book.theme_slugs || []).map(t => {
        const name = WIKI_DATA.themes[t] ? WIKI_DATA.themes[t].name : t;
        return '<span class="tag-chip" style="background:rgba(192,132,252,0.12); border-color:rgba(192,132,252,0.3); color:#d8b4fe;" data-action="filter-theme" data-slug="' + t + '">' + name + '</span>';
      }).join('');

      let quotesHtml = '';
      const rawQuotes = (book.quotes_raw || '').split(/\n-\s+/).filter(q => q.trim());
      rawQuotes.forEach(q => {
        const cleanQ = q.replace(/^-/, '').trim();
        if (cleanQ) {
          quotesHtml += '<div class="quote-box">' + formatCitations(cleanQ) + '</div>';
        }
      });

      let formattedChapters = (book.chapters_raw || '')
        .replace(/###\s*(.*?)\n/g, '<h3>$1</h3>')
        .replace(/\*\s*\*\*(.*?)\*\*:\s*/g, '<li><strong>$1</strong>: ')
        .replace(/\*\s+/g, '<li>');
      formattedChapters = formatCitations(formatWikiLinks(formattedChapters));

      container.innerHTML = 
        '<div class="book-hero">' +
          '<div class="hero-meta-strip">' +
            '<span class="meta-badge badge-year">Published ' + book.year + '</span>' +
            '<span class="meta-badge badge-source">' + (book.source || '') + '</span>' +
            '<span class="meta-badge badge-source">Updated: ' + (book.last_updated || '') + '</span>' +
          '</div>' +
          '<h1 class="book-hero-title">' + book.title + '</h1>' +
          '<div class="book-hero-authors">By ' + authorLinks + '</div>' +
          '<div class="hero-tags-group">' +
            '<div class="hero-tag-row">' +
              '<span class="hero-tag-label">Genres:</span>' + genreChips +
            '</div>' +
            '<div class="hero-tag-row">' +
              '<span class="hero-tag-label">Themes:</span>' + themeChips +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">' +
              '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Executive Summary' +
            '</div>' +
          '</div>' +
          '<div class="exec-summary-content">' + formatCitations(formatWikiLinks((book.exec_summary || '').replace(/\n\n/g, '</p><p>'))) + '</div>' +
        '</div>' +
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">' +
              '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg> Key Arguments & Chapter Breakdown' +
            '</div>' +
          '</div>' +
          '<div class="chapter-breakdown">' + formattedChapters + '</div>' +
        '</div>' +
        (quotesHtml ? 
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">' +
              '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg> Key Quotes & Citations' +
            '</div>' +
          '</div>' + quotesHtml +
        '</div>' : '') +
        '<div class="section-card">' +
          '<div class="section-header">' +
            '<div class="section-title">' +
              '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg> Thematic Connections' +
            '</div>' +
          '</div>' +
          '<div class="thematic-content">' + formatCitations(formatWikiLinks(book.thematic_raw || '')) + '</div>' +
        '</div>';
    }

    function openEntityModal(slug) {
      const overlay = document.getElementById('modalOverlay');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');

      if (WIKI_DATA.authors && WIKI_DATA.authors[slug]) {
        const a = WIKI_DATA.authors[slug];
        titleEl.textContent = 'Author: ' + a.name;
        bodyEl.innerHTML = 
          '<p style="margin-bottom:12px;"><strong>Movements / Eras:</strong> ' + formatWikiLinks(a.eras) + '</p>' +
          '<p style="margin-bottom:16px;"><strong>Primary Genres:</strong> ' + formatWikiLinks(a.genres) + '</p>' +
          '<h4 style="margin-bottom:8px; color:var(--accent-primary);">Biography & Context</h4>' +
          '<p style="margin-bottom:16px;">' + formatWikiLinks(a.bio) + '</p>' +
          '<h4 style="margin-bottom:8px; color:var(--accent-primary);">Recurring Themes</h4>' +
          '<div>' + formatWikiLinks((a.recurring_themes || '').replace(/\n/g, '<br>')) + '</div>';
      } else if (WIKI_DATA.themes && WIKI_DATA.themes[slug]) {
        const t = WIKI_DATA.themes[slug];
        titleEl.textContent = 'Theme: ' + t.name;
        bodyEl.innerHTML = 
          '<p style="margin-bottom:16px;"><strong>Summary:</strong> ' + formatWikiLinks(t.summary) + '</p>' +
          '<h4 style="margin-bottom:8px; color:var(--accent-primary);">Cross-Cutting Synthesis</h4>' +
          '<p>' + formatWikiLinks((t.synthesis || '').replace(/\n\n/g, '</p><p>')) + '</p>';
      } else if (WIKI_DATA.genres && WIKI_DATA.genres[slug]) {
        const g = WIKI_DATA.genres[slug];
        titleEl.textContent = 'Genre: ' + g.name;
        bodyEl.innerHTML = 
          '<p style="margin-bottom:16px;"><strong>Description:</strong> ' + formatWikiLinks(g.description) + '</p>' +
          '<h4 style="margin-bottom:8px; color:var(--accent-primary);">Overview & Scope</h4>' +
          '<p>' + formatWikiLinks((g.overview || '').replace(/\n\n/g, '</p><p>')) + '</p>';
      } else if (WIKI_DATA.books && WIKI_DATA.books.some(b => b.slug === slug)) {
        overlay.classList.remove('active');
        selectBook(slug);
        return;
      } else {
        titleEl.textContent = slug;
        bodyEl.innerHTML = '<p>Entity details not found.</p>';
      }

      overlay.classList.add('active');
    }

    // Event Delegation
    document.addEventListener('click', function(e) {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const slug = target.dataset.slug;

      if (action === 'select-book') {
        selectBook(slug);
      } else if (action === 'open-entity') {
        openEntityModal(slug);
      } else if (action === 'filter-genre') {
        document.getElementById('genreFilter').value = slug;
        renderBookList();
      } else if (action === 'filter-theme') {
        document.getElementById('themeFilter').value = slug;
        renderBookList();
      }
    });

    document.getElementById('modalClose').onclick = () => {
      document.getElementById('modalOverlay').classList.remove('active');
    };

    document.getElementById('modalOverlay').onclick = (e) => {
      if (e.target.id === 'modalOverlay') {
        document.getElementById('modalOverlay').classList.remove('active');
      }
    };

    // Sidebar listeners
    document.getElementById('sidebarToggle').onclick = toggleSidebar;
    document.getElementById('sidebarCloseBtn').onclick = closeSidebar;
    document.getElementById('sidebarBackdrop').onclick = closeSidebar;

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        document.getElementById('modalOverlay').classList.remove('active');
        closeSidebar();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
        e.preventDefault();
        toggleSidebar();
      }
    });

    document.getElementById('themeToggle').onclick = () => {
      document.body.classList.toggle('light-theme');
    };

    // Restore desktop sidebar collapsed preference
    try {
      if (!isMobileView() && localStorage.getItem('gilgamis_sidebar_collapsed') === '1') {
        document.body.classList.add('sidebar-collapsed');
      }
    } catch(e) {}

    // Sort button listeners
    const sortYearEl = document.getElementById('sortYearBtn');
    if (sortYearEl) sortYearEl.onclick = () => setSortMode('year');
    const sortAddedEl = document.getElementById('sortAddedBtn');
    if (sortAddedEl) sortAddedEl.onclick = () => setSortMode('added');

    // Initialize UI
    updateSortButtonsUI();
    initFilters();
    renderBookList();
    renderBookDetail();
  </script>
</body>
</html>
